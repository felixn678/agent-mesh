<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <title>agent-mesh setup: up and invite on the hub machine, join on every other machine</title>
  <style>
    .panel { fill: #111827; stroke: #374151; stroke-width: 1.5; }
    .title { fill: #f9fafb; font-size: 17px; font-weight: 600; }
    .note { fill: #9ca3af; font-size: 12.5px; }
    .cmd { fill: #1f2937; stroke: #4b5563; stroke-width: 1.2; }
    .cmdt { fill: #e5e7eb; font-size: 14px; font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
    .num { fill: #f59e0b; font-size: 13px; font-weight: 700; }
    .ok { fill: #34d399; font-size: 14px; font-weight: 600; }
  </style>
  <rect width="960" height="260" rx="16" fill="#0b0f17"/>

  <rect class="panel" x="20" y="20" width="400" height="220" rx="12"/>
  <text class="title" x="40" y="50">Hub machine</text>
  <text class="note" x="40" y="70">any always-on machine, e.g. Ubuntu</text>
  <rect class="panel" x="540" y="20" width="400" height="220" rx="12"/>
  <text class="title" x="560" y="50">Every other machine</text>
  <text class="note" x="560" y="70">e.g. your Mac, or a friend's laptop</text>

  <g>
    <rect class="cmd" x="40" y="90" width="360" height="44" rx="8">
      <animate attributeName="stroke" values="#4b5563;#f59e0b;#4b5563" keyTimes="0;0.02;0.25" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
    <text class="num" x="56" y="117">1</text><text class="cmdt" x="76" y="117">agent-mesh up</text>
    <rect class="cmd" x="40" y="150" width="360" height="44" rx="8">
      <animate attributeName="stroke" values="#4b5563;#f59e0b;#4b5563" keyTimes="0;0.25;0.45" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
    <text class="num" x="56" y="177">2</text><text class="cmdt" x="76" y="177">agent-mesh invite mac</text>
    <rect class="cmd" x="560" y="150" width="360" height="44" rx="8">
      <animate attributeName="stroke" values="#4b5563;#f59e0b;#4b5563" keyTimes="0;0.7;0.95" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
    <text class="num" x="576" y="177">3</text><text class="cmdt" x="596" y="177">agent-mesh join</text>
  </g>

  <path id="code" d="M400,172 L560,172" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <g opacity="0">
    <rect x="-34" y="-13" width="68" height="26" rx="6" fill="#f59e0b"/>
    <text x="0" y="5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1f2937">code</text>
    <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.45;0.7;1" calcMode="linear"><mpath href="#code"/></animateMotion>
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.45;0.7" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </g>
  <text class="note" x="480" y="210" text-anchor="middle">invite code</text>

  <g opacity="0">
    <text class="ok" x="40" y="222">✓ hub running</text>
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.2" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <text class="ok" x="560" y="222">✓ joined, Claude Code connected</text>
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.9" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </g>
</svg>

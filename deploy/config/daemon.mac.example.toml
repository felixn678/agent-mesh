# ~/.config/agent-mesh/daemon.toml  (mode 0600). Placeholders only.
hub_url = "http://<hub-tailnet-name>:8787"   # Tailscale MagicDNS name or <tailnet-ip>
# host_token_file = "<config-dir>/host.token"   # default: host.token next to this file
state_dir = "~/.local/share/agent-mesh"   # repos/ worktrees/ logs/ spool/ run/

poll_interval = "30s"
heartbeat_interval = "60s"
task_timeout = "3h"
git_call_timeout = "120s"                 # keep below hub lease_ttl / 2

# max_slots = 2                           # optional; default is derived from cores/RAM
max_cpu_pct = 80
min_mem_avail_pct = 25
max_agent_worktrees = 2
stuck_retention = "72h"
log_retention = "168h"

allowed_permission_modes = ["acceptEdits", "dontAsk"]   # bypassPermissions/auto refuse to start
max_budget_usd_cap = 5.0
worker_setting_sources = "project"
claude_bin = "claude"
claude_env_file = ""                      # optional 0600 file: CLAUDE_CODE_OAUTH_TOKEN=...
# gh_env_file = "<config-dir>/gh.env"   # default: gh.env next to this file (0600: GH_TOKEN=<fine-grained PAT>); missing = use gh's own login
gitleaks_bin = "gitleaks"

# Allowlist: repo key -> remote URL the daemon clones (into state_dir/repos).
# Keys are matched in canonical form: tasks added from a Claude session use
# the session's normalized git remote ("github.com/<user>/<repo>"), so use that
# (or the remote URL itself) as the key. A short key like "<repo>" only
# matches tasks added with --repo <repo>.
[repos]
"github.com/<user>/<repo>" = "https://github.com/<user>/<repo>.git"

[tool_profiles.default]
allow = ["Read", "Edit", "Write", "Glob", "Grep",
         "Bash(git status*)", "Bash(git diff*)", "Bash(git log*)",
         "Bash(git add *)", "Bash(git commit *)",
         "Bash(go test *)", "Bash(go build *)", "Bash(go vet *)"]

[tool_profiles.edit-only]
allow = ["Read", "Edit", "Write", "Glob", "Grep", "Bash(git add *)", "Bash(git commit *)"]
